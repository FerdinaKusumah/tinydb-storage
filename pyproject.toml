[tool.poetry]
name = "tinydbstorage"
version = "0.2.1"
description = "Redis and S3 storages for TinyDB that refuse to overwrite each other."
authors = ["Ferdina Kusumah <ferdina.kusumah@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tinydbstorage" }]

homepage = "https://github.com/FerdinaKusumah/tinydb-storage"
repository = "https://github.com/FerdinaKusumah/tinydb-storage"
keywords = ["tinydb", "storage", "redis", "s3", "minio", "r2", "database"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
tinydb = ">=4.8,<5"
redis = { version = ">=5", optional = true }
boto3 = { version = ">=1.34", optional = true }

[tool.poetry.extras]
redis = ["redis"]
s3 = ["boto3"]
all = ["redis", "boto3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
black = ">=24"
fakeredis = ">=2.20"
moto = { version = ">=5.0.20", extras = ["s3"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "--cov=tinydbstorage --cov-report=term-missing --cov-fail-under=95"
